name: Northstar quality checks

on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      INVENTORY_DB_PATH: ${{ github.workspace }}/data/inventory.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r server/requirements-dev.txt

      - name: Install Flyway CLI
        run: |
          curl --fail --silent --show-error --location \
            https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/13.12.1/flyway-commandline-13.12.1-linux-x64.tar.gz \
            | tar -xz
          echo "$GITHUB_WORKSPACE/flyway-13.12.1" >> "$GITHUB_PATH"

      - name: Create and migrate the CI database
        run: |
          mkdir -p data
          npm run db:migrate

      - name: Run Python unit and integration tests
        working-directory: server
        run: python -m pytest tests/unit tests/integration

      - name: Build the frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Set up Chrome for Selenium
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Run Playwright and Selenium against the API-backed app
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          python -m uvicorn app.main:app --app-dir server --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/northstar-api.log" 2>&1 &
          api_pid=$!
          npm run dev -- --host 127.0.0.1 --port 5173 \
            > "$RUNNER_TEMP/northstar-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
              && curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:8000/health >/dev/null \
            || ! curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
            cat "$RUNNER_TEMP/northstar-api.log"
            cat "$RUNNER_TEMP/northstar-vite.log"
            exit 1
          fi

          npm test
          npm run test:selenium

      - name: Upload Playwright reports and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
